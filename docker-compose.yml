version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: byteurl-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: byteurl-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: byteurl-auth
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT_AUTH: 5001
      # talk to mongo container, not localhost
      MONGO_URI: mongodb://mongo:27017/byteurl
      # frontend still on Vite
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "5001:5001"

  shortener:
    build:
      context: .
      dockerfile: services/shortener/Dockerfile
    container_name: byteurl-shortener
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    environment:
      NODE_ENV: production
      PORT_SHORTENER: 5002
      MONGO_URI: mongodb://mongo:27017/byteurl
      REDIS_URL: redis://redis:6379
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "5002:5002"

  gateway:
    image: nginx:latest
    container_name: byteurl-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - auth
      - shortener
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  mongo_data: