# nginx/nginx.conf

events {}

http {
    # Allow large JSON bodies
    client_max_body_size 10M;

    # Gateway server
    server {
        listen 8080;

        # Route: /auth → auth service (5001)
        location /auth/ {
            proxy_pass http://auth:5001/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Route: /api → shortener service (5002)
        location /api/ {
            proxy_pass http://shortener:5002/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-Id $request_id;
        }

        # Route: /<shortCode> → redirect service
        # Anything not starting with /api or /auth is a short code
        location / {
            proxy_pass http://shortener:5002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-Id $request_id;
        }
    }
}
